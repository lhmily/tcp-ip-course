      <rect x="72" y="346" width="1296" height="34" rx="7" fill="#242422" stroke="#383835"/>
      <rect x="72" y="346" width="10" height="34" rx="5" fill="#d95926"/>
      <rect x="82" y="346" width="30" height="34" fill="url(#ingress-dark-network)"/>
      <text x="124" y="368" font-size="14" font-weight="700">NF_INET_PRE_ROUTING</text>
      <text x="480" y="368" font-size="12" fill="#c3c2b7">net/ipv4/ip_input.c:569</text>
      <text x="790" y="368" font-size="12" fill="#c3c2b7">sk_buff retained, consumed, or stolen by a hook</text>
      <line x1="56" y1="376" x2="56" y2="392" stroke="#c3c2b7" stroke-width="2" stroke-dasharray="10 5" marker-end="url(#ingress-dark-arrow)"/>
      <text x="92" y="387" font-size="9" fill="#a4a39d">hook-continuation</text>
      <rect x="72" y="388" width="1296" height="34" rx="7" fill="#242422" stroke="#383835"/>
      <rect x="72" y="388" width="10" height="34" rx="5" fill="#d95926"/>
      <rect x="82" y="388" width="30" height="34" fill="url(#ingress-dark-network)"/>
      <text x="124" y="410" font-size="14" font-weight="700">ip_rcv_finish</text>
      <text x="480" y="410" font-size="12" fill="#c3c2b7">net/ipv4/ip_input.c:435</text>
      <text x="790" y="410" font-size="12" fill="#c3c2b7">sk_buff passed toward route input</text>
      <line x1="56" y1="418" x2="56" y2="434" stroke="#c3c2b7" stroke-width="2" marker-end="url(#ingress-dark-arrow)"/>
      <text x="92" y="429" font-size="9" fill="#a4a39d">direct-call</text>
      <rect x="72" y="430" width="1296" height="34" rx="7" fill="#242422" stroke="#383835"/>
      <rect x="72" y="430" width="10" height="34" rx="5" fill="#d95926"/>
      <rect x="82" y="430" width="30" height="34" fill="url(#ingress-dark-network)"/>
      <text x="124" y="452" font-size="14" font-weight="700">ip_route_input_noref</text>
      <text x="480" y="452" font-size="12" fill="#c3c2b7">net/ipv4/route.c:2487</text>
      <text x="790" y="452" font-size="12" fill="#c3c2b7">route attached to sk_buff without a caller reference</text>
      <line x1="56" y1="460" x2="56" y2="476" stroke="#c3c2b7" stroke-width="2" stroke-dasharray="14 5 3 5" marker-end="url(#ingress-dark-arrow)"/>
      <text x="92" y="471" font-size="9" fill="#a4a39d">conditional-slow-path</text>
      <rect x="72" y="472" width="1296" height="34" rx="7" fill="#242422" stroke="#383835"/>
      <rect x="72" y="472" width="10" height="34" rx="5" fill="#d95926"/>
      <rect x="82" y="472" width="30" height="34" fill="url(#ingress-dark-network)"/>
