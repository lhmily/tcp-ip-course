      <text x="480" y="578" font-size="12" fill="#c3c2b7">net/ipv4/ip_input.c:242</text>
      <text x="790" y="578" font-size="12" fill="#c3c2b7">sk_buff retained through reassembly or passed to hook</text>
      <line x1="56" y1="586" x2="56" y2="602" stroke="#c3c2b7" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#ingress-dark-arrow)"/>
