<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1076" width="100%" role="img" aria-labelledby="ingress-dark-title ingress-dark-desc">
  <title id="ingress-dark-title">Linux v6.6 TCP ingress source walkthrough</title>
  <desc id="ingress-dark-desc">A 16-node ingress reading route grouped by four labeled phases. Every node gives a source symbol and ownership summary; line patterns identify edge types.</desc>
  <defs>
    <marker id="ingress-dark-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c3c2b7"/>
    </marker>
    <pattern id="ingress-dark-packet-io" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 4 H8" stroke="#3987e5" stroke-width="1" opacity=".34"/>
    </pattern>
    <pattern id="ingress-dark-network" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M-2 8 L8 -2 M2 10 L10 2" stroke="#d95926" stroke-width="1" opacity=".34"/>
    </pattern>
    <pattern id="ingress-dark-transport" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M-2 8 L8 -2 M2 10 L10 2 M-2 0 L8 10 M2 -2 L10 6" stroke="#199e70" stroke-width="1" opacity=".3"/>
    </pattern>
    <pattern id="ingress-dark-observation" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#c98500" opacity=".42"/>
    </pattern>
  </defs>
  <rect width="1440" height="1076" fill="#1a1a19"/>
  <g font-family="system-ui,-apple-system,Segoe UI,sans-serif" fill="#ffffff">
    <text x="56" y="58" font-size="30" font-weight="700">Linux v6.6 TCP ingress source walkthrough</text>
    <text x="56" y="88" font-size="15" fill="#c3c2b7">Linux v6.6 · authored reading route · not a universal runtime stack trace</text>
    <g aria-label="Four labeled phases">
      <rect x="56" y="116" width="317" height="54" rx="8" fill="#242422" stroke="#383835"/>
      <rect x="56" y="116" width="12" height="54" rx="6" fill="#3987e5"/>
      <rect x="68" y="116" width="36" height="54" fill="url(#ingress-dark-packet-io)"/>
      <text x="114" y="139" font-size="14" font-weight="700">Packet I/O</text>
      <text x="114" y="158" font-size="11" fill="#c3c2b7">horizontal pattern</text>
      <rect x="390" y="116" width="317" height="54" rx="8" fill="#242422" stroke="#383835"/>
      <rect x="390" y="116" width="12" height="54" rx="6" fill="#d95926"/>
      <rect x="402" y="116" width="36" height="54" fill="url(#ingress-dark-network)"/>
      <text x="448" y="139" font-size="14" font-weight="700">IPv4 and routing</text>
      <text x="448" y="158" font-size="11" fill="#c3c2b7">diagonal pattern</text>
      <rect x="724" y="116" width="317" height="54" rx="8" fill="#242422" stroke="#383835"/>
      <rect x="724" y="116" width="12" height="54" rx="6" fill="#199e70"/>
      <rect x="736" y="116" width="36" height="54" fill="url(#ingress-dark-transport)"/>
      <text x="782" y="139" font-size="14" font-weight="700">Socket and TCP</text>
      <text x="782" y="158" font-size="11" fill="#c3c2b7">crosshatch pattern</text>
      <rect x="1058" y="116" width="317" height="54" rx="8" fill="#242422" stroke="#383835"/>
      <rect x="1058" y="116" width="12" height="54" rx="6" fill="#c98500"/>
      <rect x="1070" y="116" width="36" height="54" fill="url(#ingress-dark-observation)"/>
      <text x="1116" y="139" font-size="14" font-weight="700">Observation boundary</text>
      <text x="1116" y="158" font-size="11" fill="#c3c2b7">dots pattern</text>
    </g>
    <g aria-label="ingress symbols and edges">
      <rect x="72" y="220" width="1296" height="34" rx="7" fill="#242422" stroke="#383835"/>
      <rect x="72" y="220" width="10" height="34" rx="5" fill="#3987e5"/>
      <rect x="82" y="220" width="30" height="34" fill="url(#ingress-dark-packet-io)"/>
      <text x="124" y="242" font-size="14" font-weight="700">netif_receive_skb</text>
      <text x="480" y="242" font-size="12" fill="#c3c2b7">net/core/dev.c:5805</text>
      <text x="790" y="242" font-size="12" fill="#c3c2b7">sk_buff handed to receive core</text>
      <line x1="56" y1="250" x2="56" y2="266" stroke="#c3c2b7" stroke-width="2" marker-end="url(#ingress-dark-arrow)"/>
      <text x="92" y="261" font-size="9" fill="#a4a39d">direct-call</text>
      <rect x="72" y="262" width="1296" height="34" rx="7" fill="#242422" stroke="#383835"/>
      <rect x="72" y="262" width="10" height="34" rx="5" fill="#3987e5"/>
      <rect x="82" y="262" width="30" height="34" fill="url(#ingress-dark-packet-io)"/>
      <text x="124" y="284" font-size="14" font-weight="700">__netif_receive_skb_one_core</text>
      <text x="480" y="284" font-size="12" fill="#c3c2b7">net/core/dev.c:5544</text>
      <text x="790" y="284" font-size="12" fill="#c3c2b7">sk_buff consumed or passed to protocol handler</text>
      <line x1="56" y1="292" x2="56" y2="308" stroke="#c3c2b7" stroke-width="2" stroke-dasharray="2 5" marker-end="url(#ingress-dark-arrow)"/>
      <text x="92" y="303" font-size="9" fill="#a4a39d">callback-dispatch</text>
      <rect x="72" y="304" width="1296" height="34" rx="7" fill="#242422" stroke="#383835"/>
      <rect x="72" y="304" width="10" height="34" rx="5" fill="#d95926"/>
      <rect x="82" y="304" width="30" height="34" fill="url(#ingress-dark-network)"/>
      <text x="124" y="326" font-size="14" font-weight="700">ip_rcv</text>
      <text x="480" y="326" font-size="12" fill="#c3c2b7">net/ipv4/ip_input.c:560</text>
      <text x="790" y="326" font-size="12" fill="#c3c2b7">sk_buff retained on accepted path</text>
      <line x1="56" y1="334" x2="56" y2="350" stroke="#c3c2b7" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#ingress-dark-arrow)"/>
