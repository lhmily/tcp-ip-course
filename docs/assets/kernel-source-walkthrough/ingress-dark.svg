      <text x="480" y="662" font-size="12" fill="#c3c2b7">net/ipv4/ip_input.c:227</text>
      <text x="790" y="662" font-size="12" fill="#c3c2b7">sk_buff passed to registered transport handler</text>
      <line x1="56" y1="670" x2="56" y2="686" stroke="#c3c2b7" stroke-width="2" stroke-dasharray="2 5" marker-end="url(#ingress-dark-arrow)"/>
      <text x="92" y="681" font-size="9" fill="#a4a39d">callback-dispatch</text>
