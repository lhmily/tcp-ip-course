      <text x="790" y="536" font-size="12" fill="#c3c2b7">sk_buff passed to destination input callback</text>
      <line x1="56" y1="544" x2="56" y2="560" stroke="#c3c2b7" stroke-width="2" stroke-dasharray="2 5" marker-end="url(#ingress-dark-arrow)"/>
      <text x="92" y="555" font-size="9" fill="#a4a39d">callback-dispatch</text>
