      <text x="480" y="620" font-size="12" fill="#c3c2b7">net/ipv4/ip_input.c:254</text>
      <text x="790" y="620" font-size="12" fill="#c3c2b7">sk_buff retained, consumed, or stolen by a hook</text>
      <line x1="56" y1="628" x2="56" y2="644" stroke="#c3c2b7" stroke-width="2" stroke-dasharray="10 5" marker-end="url(#ingress-dark-arrow)"/>
      <text x="92" y="639" font-size="9" fill="#a4a39d">hook-continuation</text>
      <rect x="72" y="640" width="1296" height="34" rx="7" fill="#242422" stroke="#383835"/>
