      <text x="480" y="494" font-size="12" fill="#c3c2b7">net/ipv4/route.c:2223</text>
      <text x="790" y="494" font-size="12" fill="#c3c2b7">computed route attached to sk_buff</text>
      <line x1="56" y1="502" x2="56" y2="518" stroke="#c3c2b7" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#ingress-dark-arrow)"/>
      <text x="92" y="513" font-size="9" fill="#a4a39d">sequencing</text>
      <rect x="72" y="514" width="1296" height="34" rx="7" fill="#242422" stroke="#383835"/>
