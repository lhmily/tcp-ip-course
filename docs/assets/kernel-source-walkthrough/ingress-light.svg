      <text x="480" y="284" font-size="12" fill="#52514e">net/core/dev.c:5544</text>
      <text x="790" y="284" font-size="12" fill="#52514e">sk_buff consumed or passed to protocol handler</text>
      <line x1="56" y1="292" x2="56" y2="308" stroke="#52514e" stroke-width="2" stroke-dasharray="2 5" marker-end="url(#ingress-light-arrow)"/>
