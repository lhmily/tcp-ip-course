      <rect x="72" y="220" width="10" height="34" rx="5" fill="#2a78d6"/>
      <rect x="82" y="220" width="30" height="34" fill="url(#ingress-light-packet-io)"/>
      <text x="124" y="242" font-size="14" font-weight="700">netif_receive_skb</text>
      <text x="480" y="242" font-size="12" fill="#52514e">net/core/dev.c:5805</text>
      <text x="790" y="242" font-size="12" fill="#52514e">sk_buff handed to receive core</text>
