      <text x="480" y="410" font-size="12" fill="#52514e">net/ipv4/ip_input.c:435</text>
      <text x="790" y="410" font-size="12" fill="#52514e">sk_buff passed toward route input</text>
      <line x1="56" y1="418" x2="56" y2="434" stroke="#52514e" stroke-width="2" marker-end="url(#ingress-light-arrow)"/>
      <text x="92" y="429" font-size="9" fill="#706f6a">direct-call</text>
      <rect x="72" y="430" width="1296" height="34" rx="7" fill="#ffffff" stroke="#e1e0d9"/>
      <rect x="72" y="430" width="10" height="34" rx="5" fill="#eb6834"/>
      <rect x="82" y="430" width="30" height="34" fill="url(#ingress-light-network)"/>
