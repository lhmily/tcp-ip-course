<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1076" width="100%" role="img" aria-labelledby="ingress-light-title ingress-light-desc">
  <title id="ingress-light-title">Linux v6.6 TCP ingress source walkthrough</title>
  <desc id="ingress-light-desc">A 16-node ingress reading route grouped by four labeled phases. Every node gives a source symbol and ownership summary; line patterns identify edge types.</desc>
  <defs>
    <marker id="ingress-light-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#52514e"/>
    </marker>
    <pattern id="ingress-light-packet-io" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 4 H8" stroke="#2a78d6" stroke-width="1" opacity=".34"/>
    </pattern>
    <pattern id="ingress-light-network" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M-2 8 L8 -2 M2 10 L10 2" stroke="#eb6834" stroke-width="1" opacity=".34"/>
    </pattern>
    <pattern id="ingress-light-transport" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M-2 8 L8 -2 M2 10 L10 2 M-2 0 L8 10 M2 -2 L10 6" stroke="#1baf7a" stroke-width="1" opacity=".3"/>
    </pattern>
    <pattern id="ingress-light-observation" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#eda100" opacity=".42"/>
    </pattern>
  </defs>
  <rect width="1440" height="1076" fill="#fcfcfb"/>
  <g font-family="system-ui,-apple-system,Segoe UI,sans-serif" fill="#0b0b0b">
    <text x="56" y="58" font-size="30" font-weight="700">Linux v6.6 TCP ingress source walkthrough</text>
    <text x="56" y="88" font-size="15" fill="#52514e">Linux v6.6 · authored reading route · not a universal runtime stack trace</text>
    <g aria-label="Four labeled phases">
      <rect x="56" y="116" width="317" height="54" rx="8" fill="#ffffff" stroke="#e1e0d9"/>
      <rect x="56" y="116" width="12" height="54" rx="6" fill="#2a78d6"/>
      <rect x="68" y="116" width="36" height="54" fill="url(#ingress-light-packet-io)"/>
      <text x="114" y="139" font-size="14" font-weight="700">Packet I/O</text>
      <text x="114" y="158" font-size="11" fill="#52514e">horizontal pattern</text>
      <rect x="390" y="116" width="317" height="54" rx="8" fill="#ffffff" stroke="#e1e0d9"/>
      <rect x="390" y="116" width="12" height="54" rx="6" fill="#eb6834"/>
      <rect x="402" y="116" width="36" height="54" fill="url(#ingress-light-network)"/>
      <text x="448" y="139" font-size="14" font-weight="700">IPv4 and routing</text>
      <text x="448" y="158" font-size="11" fill="#52514e">diagonal pattern</text>
      <rect x="724" y="116" width="317" height="54" rx="8" fill="#ffffff" stroke="#e1e0d9"/>
      <rect x="724" y="116" width="12" height="54" rx="6" fill="#1baf7a"/>
      <rect x="736" y="116" width="36" height="54" fill="url(#ingress-light-transport)"/>
      <text x="782" y="139" font-size="14" font-weight="700">Socket and TCP</text>
      <text x="782" y="158" font-size="11" fill="#52514e">crosshatch pattern</text>
      <rect x="1058" y="116" width="317" height="54" rx="8" fill="#ffffff" stroke="#e1e0d9"/>
      <rect x="1058" y="116" width="12" height="54" rx="6" fill="#eda100"/>
      <rect x="1070" y="116" width="36" height="54" fill="url(#ingress-light-observation)"/>
      <text x="1116" y="139" font-size="14" font-weight="700">Observation boundary</text>
      <text x="1116" y="158" font-size="11" fill="#52514e">dots pattern</text>
    </g>
    <g aria-label="ingress symbols and edges">
