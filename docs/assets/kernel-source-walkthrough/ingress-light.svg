      <text x="480" y="452" font-size="12" fill="#52514e">net/ipv4/route.c:2487</text>
      <text x="790" y="452" font-size="12" fill="#52514e">route attached to sk_buff without a caller reference</text>
      <line x1="56" y1="460" x2="56" y2="476" stroke="#52514e" stroke-width="2" stroke-dasharray="14 5 3 5" marker-end="url(#ingress-light-arrow)"/>
      <text x="92" y="471" font-size="9" fill="#706f6a">conditional-slow-path</text>
      <rect x="72" y="472" width="1296" height="34" rx="7" fill="#ffffff" stroke="#e1e0d9"/>
      <rect x="72" y="472" width="10" height="34" rx="5" fill="#eb6834"/>
      <rect x="82" y="472" width="30" height="34" fill="url(#ingress-light-network)"/>
