<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img">
  <title>TCP/IP Course layer progression</title>
  <desc>A twelve-lesson C17 course progresses from bytes and local links through Internet and transport protocols to applications and diagnostics.</desc>
  <rect width="1200" height="630" rx="24" fill="#07111f"/>
  <text x="600" y="65" text-anchor="middle" font-family="system-ui,sans-serif" font-size="40" font-weight="700" fill="#f8fafc">TCP/IP from bytes to diagnostics</text>
  <text x="600" y="118" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="#a7bdd4">12 tested lessons · portable C17 · CMake + CTest · POSIX sockets</text>
  <g font-family="system-ui,sans-serif">
    <rect x="45" y="190" width="200" height="170" rx="18" fill="#0c2a3f" stroke="#38bdf8" stroke-width="2"/>
    <text x="145" y="230" text-anchor="middle" font-size="14" font-weight="700" fill="#7dd3fc">LESSONS 1–2</text><text x="145" y="273" text-anchor="middle" font-size="23" font-weight="700" fill="#f8fafc">Foundations</text><text x="145" y="309" text-anchor="middle" font-size="15" fill="#a7bdd4">Bytes · checksum</text><text x="145" y="334" text-anchor="middle" font-size="15" fill="#a7bdd4">Ethernet · ARP</text>
    <path d="M255 275 H275" stroke="#64748b" stroke-width="4"/><path d="M268 266 L279 275 L268 284" fill="none" stroke="#64748b" stroke-width="4"/>
    <rect x="285" y="190" width="200" height="170" rx="18" fill="#14284a" stroke="#818cf8" stroke-width="2"/>
    <text x="385" y="230" text-anchor="middle" font-size="14" font-weight="700" fill="#a5b4fc">LESSONS 3–4</text><text x="385" y="273" text-anchor="middle" font-size="23" font-weight="700" fill="#f8fafc">Internet</text><text x="385" y="309" text-anchor="middle" font-size="15" fill="#a7bdd4">IPv4 packets</text><text x="385" y="334" text-anchor="middle" font-size="15" fill="#a7bdd4">ICMP messages</text>
    <path d="M495 275 H515" stroke="#64748b" stroke-width="4"/><path d="M508 266 L519 275 L508 284" fill="none" stroke="#64748b" stroke-width="4"/>
    <rect x="525" y="190" width="200" height="170" rx="18" fill="#12332f" stroke="#34d399" stroke-width="2"/>
    <text x="625" y="230" text-anchor="middle" font-size="14" font-weight="700" fill="#6ee7b7">LESSONS 5–7</text><text x="625" y="273" text-anchor="middle" font-size="23" font-weight="700" fill="#f8fafc">Transport</text><text x="625" y="309" text-anchor="middle" font-size="15" fill="#a7bdd4">UDP · TCP segments</text><text x="625" y="334" text-anchor="middle" font-size="15" fill="#a7bdd4">State · reliability</text>
    <path d="M735 275 H755" stroke="#64748b" stroke-width="4"/><path d="M748 266 L759 275 L748 284" fill="none" stroke="#64748b" stroke-width="4"/>
    <rect x="765" y="190" width="200" height="170" rx="18" fill="#422b17" stroke="#f59e0b" stroke-width="2"/>
    <text x="865" y="230" text-anchor="middle" font-size="14" font-weight="700" fill="#fbbf24">LESSONS 8–10</text><text x="865" y="273" text-anchor="middle" font-size="23" font-weight="700" fill="#f8fafc">Applications</text><text x="865" y="309" text-anchor="middle" font-size="15" fill="#a7bdd4">Sockets · DNS</text><text x="865" y="334" text-anchor="middle" font-size="15" fill="#a7bdd4">HTTP framing</text>
    <path d="M975 275 H995" stroke="#64748b" stroke-width="4"/><path d="M988 266 L999 275 L988 284" fill="none" stroke="#64748b" stroke-width="4"/>
    <rect x="1005" y="190" width="150" height="170" rx="18" fill="#3e2135" stroke="#f472b6" stroke-width="2"/>
    <text x="1080" y="230" text-anchor="middle" font-size="14" font-weight="700" fill="#f9a8d4">11–12</text><text x="1080" y="270" text-anchor="middle" font-size="20" font-weight="700" fill="#f8fafc">Practice</text><text x="1080" y="306" text-anchor="middle" font-size="14" fill="#a7bdd4">Routing · NAT</text><text x="1080" y="331" text-anchor="middle" font-size="14" fill="#a7bdd4">Diagnostics</text>
  </g>
  <text x="600" y="535" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="600" fill="#dbeafe">Offline byte buffers first · loopback only for native socket exercises · no privileged capture</text>
</svg>
