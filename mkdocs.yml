site_name: TCP/IP Course in C17
site_description: Learn TCP/IP from bytes to diagnostics in 12 tested C17 lessons using CMake, CTest, and POSIX sockets.
site_url: https://lhmily.github.io/tcp-ip-course/
repo_url: https://github.com/lhmily/tcp-ip-course
repo_name: lhmily/tcp-ip-course
edit_uri: ""
docs_dir: .site-docs
site_dir: site
strict: true
use_directory_urls: true
hooks:
  - scripts/mkdocs_hooks.py

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: relative_to_docs
    unrecognized_links: warn

extra:
  cloudflare_web_analytics_token: !ENV [CLOUDFLARE_WEB_ANALYTICS_TOKEN, ""]
  homepage: https://lhmily.github.io/
  social:
    - icon: material/home
      link: https://lhmily.github.io/
      name: lhmily Home
    - icon: fontawesome/brands/github
      link: https://github.com/lhmily/tcp-ip-course
      name: TCP/IP Course on GitHub
  generator: false

extra_css:
  - stylesheets/course.css

theme:
  name: material
  custom_dir: docs/overrides
  favicon: assets/branding/lemon.svg
  language: en
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true

plugins:
  - search
