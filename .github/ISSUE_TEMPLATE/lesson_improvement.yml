name: Lesson or Linux lab improvement
description: Propose a focused improvement to one of 12 core lessons or 4 optional Linux labs
title: "[Lesson]: "
labels: [enhancement]
body:
  - type: input
    id: lesson
    attributes:
      label: Lesson or Linux lab directory
      placeholder: lessons/06_tcp_segments or linux_labs/02_tcp_info
    validations:
      required: true
  - type: textarea
    id: learner_problem
    attributes:
      label: Learner problem
      description: What is unclear, missing, misleading, or difficult to practice?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Explain how the README, lesson.h, exercise.c, solution.c, test.c, and CMakeLists.txt contract is affected.
    validations:
      required: true
  - type: checkboxes
    id: contract
    attributes:
      label: Lesson contract
      options:
        - label: Starter and solution keep the same public declarations in lesson.h.
          required: true
        - label: Tests remain deterministic and use offline buffers or loopback with an ephemeral port.
          required: true
        - label: Documentation keeps all required headings, a unique Mermaid diagram, C example, table, non-goal, and What to notice callout.
          required: true
        - label: The proposal does not require privileges, namespaces, capture, raw or packet sockets, TUN/TAP, external traffic, process execution, or fork/clone.
          required: true
        - label: Linux source references are pinned to v6.6, distinguish UAPI from internals, and copy no GPL kernel code.
          required: true
