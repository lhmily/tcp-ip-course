name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native:
    name: Native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Compile student exercises
        run: |
          cmake --preset student
          cmake --build --preset student
      - name: Build reference implementations
        run: |
          cmake --preset reference
          cmake --build --preset reference
      - name: Run reference tests
        run: ctest --preset reference

  sanitizers:
    name: Clang sanitizers
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Configure and build
        run: |
          cmake --preset sanitize
          cmake --build --preset sanitize
      - name: Run ASan and UBSan tests
        run: ctest --preset sanitize

  docs:
    name: Repository and documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.14
      - name: Install locked tooling
        run: uv sync --locked --dev
      - name: Run repository and documentation tests
        run: uv run pytest tests/test_repository_contract.py tests/test_documentation.py
      - name: Lint Python tooling
        run: uv run ruff check .
      - name: Check Python formatting
        run: uv run ruff format --check .
      - name: Check generated assets
        run: |
          uv run python scripts/generate_branding_assets.py --check
          uv run python scripts/generate_documentation_assets.py --check
      - name: Build strict course site
        run: |
          uv run python scripts/build_site.py
          uv run mkdocs build --strict
